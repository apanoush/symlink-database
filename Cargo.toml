[package]
name = "symlink_database"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.0", features = ["derive"] }
directories = "6.0.0"
ignore = "0.4.23"
indicatif = "0.18.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
shellexpand = "3.1.2"
thiserror = "2.0.20"
toml = "1.1.4"
walkdir = "2.5.0"

[[bin]]
name = "lndb"
path = "src/main.rs"
