[package]
name = "symlink_database"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/apanoush/lndb"
authors = ["aa-p"]

[package.metadata.wix]
upgrade-guid = "314AE640-9DC3-4566-B845-AA19E4FA5217"
path-guid = "95710D33-184F-4C7C-B978-658738439D22"
license = false
eula = false

[dependencies]
clap = { version = "4.5.0", features = ["derive"] }
directories = "6.0.0"
ignore = "0.4.23"
indicatif = "0.18.0"
ratatui = "0.30.2"
rayon = "1.10"
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
shellexpand = "3.1.2"
thiserror = "2.0.20"
toml = "1.1.4"
walkdir = "2.5.0"

[[bin]]
name = "lndb"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
